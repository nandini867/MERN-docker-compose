services:
 frontend:
  build: mern/frontend/
  ports:
    - 5173:5173
  networks:
    - demo
  
 backend:
   build: mern/backend/
   ports:
     - 5050:5050
   networks:
     - demo
   depends_on:
     - mongodb

 mongodb:
   image: mongo:latest
   ports:
    - 27017:27017
   networks: 
    - demo
   volumes: 
    - mongo-data:/data/db
    
networks:
  demo:
    driver: bridge

volumes:
  mongo-data:
   driver: local